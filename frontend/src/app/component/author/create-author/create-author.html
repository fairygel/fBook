<form [formGroup]="authorForm" (ngSubmit)="createAuthor()" autocomplete="off">
    <div class="form-group">
        <label for="fullName">new author</label>
        <input id="fullName" type="text" formControlName="fullName" class="form-for-creation">
        <button type="submit">+</button>
    </div>
</form>
