@if (isLoading) {
    <h1 class="loading">loading your book..</h1>
} @else if (book) {
    <form [formGroup]="bookForm" autocomplete="off">
        <div class="form-container" [ngClass]="{'two-columns':!isShrank, 'one-column':isShrank}">
            <div class="left-group">
                <div class="image-center-wrapper">
                    <div class="form-group form-for-image">
                        <label for="cover">cover</label>
                        <div class="form-image-wrapper"
                             (dragover)="handleDrag($event)"
                             (dragleave)="handleDrag($event)"
                             (drop)="onDrop($event)">

                            <button type="button" class="add-image-file-button" (click)="fileInput.click()">+</button>
                            <input #fileInput id="cover" type="file" accept="image/*" (change)="onFileSelected($event)"
                                   hidden>
                            @if (coverUrl) {
                                <img [src]="coverUrl" [alt]="''" width="264" height="418"/>
                            }
                        </div>
                    </div>
                </div>

                <div class="form-group name">
                    <label for="name">name</label>
                    <input (input)="onFormChange()" type="text" formControlName="name" id="name">
                </div>

                <app-select-author (onAuthorSelected)="handleSelectedAuthor($event)" [authorToShow]="author"/>

                <div class="dates-group">
                    <div class="form-group started-date">
                        <label for="startedReadDate">started</label>
                        <button (click)="focusOnElement(startedDate)" class="focusable-input"></button>
                        <input (change)="onFormChange()" type="date" formControlName="startedReadDate"
                               #startedDate>
                    </div>

                    <div class="form-group ended-date">
                        <label for="endedReadDate">ended</label>
                        <button (click)="focusOnElement(endedDate)" class="focusable-input"></button>
                        <input (change)="onFormChange()" type="date" formControlName="endedReadDate" id="endedReadDate"
                               #endedDate>
                    </div>
                </div>
            </div>

            <div class="separator"></div>

            <div class="right-group">
                <app-select-book-type (onBookTypeSelected)="handleSelectedBookType($event)"
                                      [bookTypeToShow]="bookType"/>

                <app-select-book-status (onBookStatusSelected)="handleSelectedBookStatus($event)"
                                        [bookStatusToShow]="bookStatus"/>

                <app-select-genre (onGenreSelected)="handleSelectedGenres($event)" [genresToShow]="bookGenres"/>

                <div class="form-group stretching-form annotation">
                    <label for="annotation">annotation</label>
                    <textarea (input)="onFormChange()" formControlName="annotation" id="annotation"></textarea>
                </div>
            </div>

            <span>
                <a (click)="handleUpdateBookSubmit()" routerLink="/">
                    <img class="back-image" width="32" height="32"
                         ngSrc="https://www.svgrepo.com/show/335978/arrow-left.svg" alt="←">
                </a>
            </span>

            <div class="separator"></div>

            <span class="trash-container">
                <button class="trash-image" (click)="deleteBook()">
                    <img width="24" height="24" ngSrc="https://www.svgrepo.com/show/14231/trash.svg" alt="🗑">
                </button>
            </span>
        </div>
    </form>
} @else {
    <h1>no book found:(</h1>
}
<hr/>
