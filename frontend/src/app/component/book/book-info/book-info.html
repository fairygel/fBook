@if (isOpen && showDelayedModal) {
    <div class="modal-backdrop">
        <div class="modal" [class.loaded]="!isLoading">
            @if (isLoading) {
                <div class="loading-wrapper">
                    <h1 class="loading">loading your book..</h1>
                </div>
            } @else if (book) {
                <div class="modal-content">
                    <form [formGroup]="bookForm" autocomplete="off">
                        <div class="form-container" [ngClass]="{'two-columns':!isShrank, 'one-column':isShrank}">
                            <div class="left-group">
                                <div class="image-center-wrapper">
                                    <div class="form-group form-for-image">
                                        <label for="cover">cover</label>
                                        <div class="form-image-wrapper"
                                             (dragover)="handleDrag($event)"
                                             (dragleave)="handleDrag($event)"
                                             (drop)="onDrop($event)">

                                            <button type="button" class="add-image-file-button"
                                                    (click)="fileInput.click()">+
                                            </button>
                                            <input #fileInput id="cover" type="file" accept="image/*"
                                                   (change)="onFileSelected($event)"
                                                   hidden>
                                            @if (coverUrl) {
                                                <img [src]="coverUrl" [alt]="''" width="264" height="418"/>
                                            }
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group name" [class.error]="hasFieldError('name')">
                                    <label for="name">name</label>
                                    <input (input)="onFormChange(true, 'name')" type="text" formControlName="name" id="name">
                                </div>

                                <app-select-author (authorSelectedEvent)="handleSelectedAuthor($event)"
                                                   [authorToShow]="author"/>

                                <div class="dates-group">
                                    <div class="form-group started-date" [class.error]="hasFieldError('startedReadDate')">
                                        <label for="startedReadDate">started</label>
                                        <button (click)="focusOnElement(startedDate)" class="focusable-input"></button>
                                        <input (change)="onFormChange(false, 'startedReadDate')" type="date" formControlName="startedReadDate"
                                               #startedDate>
                                        <span class="date-span">{{ startedDateFormatted }}
                                            <svg class="date-icon" viewBox="0 0 24 24">
                                                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zm0-13H5V6h14v1z"/>
                                            </svg>
                                        </span>
                                    </div>

                                    <div class="form-group ended-date" [class.error]="hasFieldError('endedReadDate')">
                                        <label for="endedReadDate">ended</label>
                                        <button (click)="focusOnElement(endedDate)" class="focusable-input"></button>
                                        <input (change)="onFormChange(false, 'endedReadDate')" type="date" formControlName="endedReadDate"
                                               id="endedReadDate"
                                               #endedDate>
                                        <span class="date-span">{{ endedDateFormatted }}
                                            <svg class="date-icon" viewBox="0 0 24 24">
                                                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zm0-13H5V6h14v1z"/>
                                            </svg>
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="separator"></div>

                            <div class="right-group">
                                <app-select-book-type (bookTypeSelectedEvent)="handleSelectedBookType($event)"
                                                      [bookTypeToShow]="bookType"/>

                                <app-select-book-status (bookStatusSelectedEvent)="handleSelectedBookStatus($event)"
                                                        [bookStatusToShow]="bookStatus"/>

                                <app-select-genre (genreSelectedEvent)="handleSelectedGenres($event)"
                                                  [genresToShow]="bookGenres"/>

                                <div class="form-group stretching-form annotation" [class.error]="hasFieldError('annotation')">
                                    <label for="annotation">annotation</label>
                                    <textarea (input)="onFormChange(false, 'annotation')" formControlName="annotation"
                                              id="annotation"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="modal-actions">
                            <button (click)="deleteBook()">
                                <img class="trash-image" width="24" height="24"
                                     src="https://www.svgrepo.com/show/14231/trash.svg" alt="🗑">
                            </button>
                        </div>
                    </form>
                </div>
            } @else {
                <h1>no book found:(</h1>
            }
        </div>
    </div>
}
