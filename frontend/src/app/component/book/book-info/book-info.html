@if (isLoading) {
    <p>loading data..</p>
} @else if (book) {
    <img [src]="imageUrl" [alt]="" width="228" height="361">
    <form [formGroup]="bookForm" (ngSubmit)="handleUpdateBookSubmit()">
        <label for="cover">update cover:</label>
        <input id="cover" type="file" accept="image/jpeg" (change)="onFileSelected($event)">
        @if (coverToUpdate) {
            <img [src]="coverToUpdateUrl" [alt]="" width="228" height="361"/>
        }
        <br/>

        <label for="name">Name:</label>
        <input type="text" formControlName="name" id="name">
        <br />

        <label for="annotation">Annotation:</label>
        <input type="text" formControlName="annotation" id="annotation">
        <br />

        <app-select-author (onAuthorSelected)="handleSelectedAuthor($event)" [authorToShow]="author" />

        <app-select-book-type (onBookTypeSelected)="handleSelectedBookType($event)" [bookTypeToShow]="bookType" />

        <app-select-book-status (onBookStatusSelected)="handleSelectedBookStatus($event)" [bookStatusToShow]="bookStatus" />

        <app-select-genre (onGenreSelected)="handleSelectedGenres($event)" [genresToShow]="bookGenres"/>

        <label for="startedReadDate">started reading:</label>
        <input type="date" formControlName="startedReadDate" id="startedReadDate">
        <br />

        <label for="endedReadDate">ended reading:</label>
        <input type="date" formControlName="endedReadDate" id="endedReadDate">
        <br />

        <button type="submit">edit book</button>
    </form>
    <button (click)="deleteBook()">delete book</button>
} @else {
    <h1>no book found:(</h1>
}
<hr />
<a routerLink="/">see your books..</a>
